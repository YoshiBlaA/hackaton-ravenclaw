<!doctype html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <link rel="stylesheet" href="carrito.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito</title>
</head>

<body>
    <header class="container d-flex align-items-center justify-content-between">
        <div class="location">
            <div class="description">
                <span class="text">Estás en</span>
                <img src="mexico-flag.png" alt="" class="location-flag" />
            </div>
        </div>

        <div class="nav-actions d-flex gap-5">
            <a href="#" class="main">Ir a página principal</a>
            <a href="#" class="login">LOG IN</a>
        </div>
    </header>

    <div id="payment-container" class="m-0 p-0 rounded p-4 m-4">
        <h3 class="text">Resumen del pedido</h3>
        <div class="order-summary">
            <div class="subtotal">
                <p class="text">
                    Subtotal (<span id="total-products">M</span> productos)
                </p>
                <p class="subtotal price">
                    <span id="subtotal-number">X.a</span> Galeones
                </p>
            </div>

            <div class="estimating_shipping">
                <p class="text">Costos de envío</p>
                <p class="shipping price">
                    <span id="shipping-number">Y.b</span> Galeones
                </p>
            </div>

            <div class="total mb-3">
                <p class="text">Total</p>
                <p class="total price">
                    <span id="total-number">X.a + Y.b</span> Galeones
                </p>
            </div>
        </div>

        <button type="button" class="btn btn-dark p-3">Pagar</button>
    </div>

    <script src="carrito.js"></script>
</body>

</html>
