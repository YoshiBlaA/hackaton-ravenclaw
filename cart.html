<!doctype html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/cart.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito</title>
</head>

<body>
    <!-- Encabezado con la ubicación actual y los enlaces de navegación -->
    <header class="container d-flex align-items-center justify-content-between">
        <div class="location">
            <div class="description">
                <span class="text">Estás en</span>
                <img src="assets/mexico-flag.png" alt="" class="location-flag" />
            </div>
        </div>

        <div class="nav-actions d-flex gap-5">
            <a href="index.html" class="main">Ir a página principal</a>
            <a href="index.html" class="login">Log In</a>
        </div>
    </header>

    <main class="cart-container p-5">
        <!-- Sección del catálogo con los productos disponibles -->
        <div id="shop_layout-container">
            <section class="catalog-section">
                <h2 class="section-subtitle">Productos Exclusivos</h2>
                <div id="catalog-list" class="catalog-grid"></div>
            </section>

            <!-- Sección del carrito con los productos seleccionados -->
            <section class="cart-section">
                <h1 class="cart-title">Carrito</h1>
                <div id="cart-items-list" class="cart-items-list"></div>
            </section>
        </div>

        <!-- Resumen del pedido y formulario de entrega -->
        <div id="payment-container" class="m-0 p-0 rounded p-4 m-4">

            <div id="payment">
                <h3 class="text">Resumen del pedido</h3>
                <div class="order-summary">
                    <div class="subtotal">
                        <p class="text">
                            Subtotal (<span id="total-products">M</span> productos)
                        </p>
                        <p class="subtotal price">
                            <span id="subtotal-number">X.a</span> Galeones
                        </p>
                    </div>

                    <div class="estimating_shipping">
                        <p class="text">Costos de envío</p>
                        <p class="shipping price">
                            <span id="shipping-number">Y.b</span> Galeones
                        </p>
                    </div>

                    <div class="total mb-3">
                        <p class="text">Total</p>
                        <p class="total price">
                            <span id="total-number">X.a + Y.b</span> Galeones
                        </p>
                    </div>
                    <button type="button" class="btn btn-dark p-3">Pagar</button>
                </div>
            </div>

            <!-- Formulario para introducir los datos de entrega -->

            <div id="user-form" class="hide">
                <h3 class="text">Datos de entrega</h3>
                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" aria-describedby="emailHelp" name="email">
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="name" name="name">
                    </div>
                    <div class="mb-3">
                        <label for="direccion" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="direccion" name="address">
                    </div>

                    <div id="submit-btns">
                        <button type="submit" class="btn btn-danger p-3">Cancelar</button>
                        <button type="submit" class="btn btn-dark p-3">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Scripts para cargar el carrito y gestionar sus acciones -->
    <script src="js/cart-storage.js"></script>
    <script src="js/cart.js"></script>
</body>

</html>
